<style>
/* These are ALIASES ONTO THE DESIGN-SYSTEM TOKENS, not a second palette. Declaring
   hex here is what made this screen's dark theme drift from the rest of the app.
   Both :root and [data-theme=dark] resolve through styles.css, so one definition wins. */
:root,[data-theme=dark]{
  --ink:var(--siyoh);--accent:var(--aksent);--on-accent:var(--aksent-matn);
  --page:var(--fon);--card:var(--karta);--text-2:var(--matn-2);--text-3:var(--matn-3);
  --border:var(--chegara);--error:var(--xato);--accent-tint:var(--aksent-fon);
  /* Pairs with --ink (= --siyoh), so it follows --on-siyoh and inverts by theme. */
  --on-ink:var(--on-siyoh);
}
body{margin:0;padding:24px;background:#E8E8EA;font-family:var(--font-text)}
/* Under 640px the viewport IS the phone: no desk margin, so the pinned bottom layer
   runs edge to edge exactly as it does in Telegram. */
@media (max-width:639px){body{padding:0;background:var(--page)}}
.font-tight{font-family:var(--font-display)}
*{font-variant-numeric:tabular-nums}
a{color:var(--ink)}a:hover{color:var(--text-2)}
/* Telegram Mini Apps show no scrollbar; without this the native bar paints over the
   pinned bottom layer's right edge and the layer reads as inset from the viewport. */
.no-bar{scrollbar-width:none;-ms-overflow-style:none}
.no-bar::-webkit-scrollbar{width:0;height:0}
/* --- Micro-interactions. Opacity/transform only, so they stay on the compositor. --- */
/* No entrance animation for benefit rows or plan cards: content inside a scroll surface
   must be stable on arrival and while scrolling. */
/* One pass of light across the recommended badge, then it stops for good. */
@keyframes pw-shimmer{from{transform:translateX(-120%)}to{transform:translateX(220%)}}
.pw-shimmer{position:relative;overflow:hidden}
.pw-shimmer::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(100deg,transparent 20%,rgba(255,255,255,.65) 50%,transparent 80%);
  animation:pw-shimmer 1100ms var(--ease) 420ms 1 both}
/* The recommended card's border, lifted just off the page. Not a shadow system —
   one ring on one element, and the system's no-shadow rule still holds elsewhere. */
.pw-glow{box-shadow:0 0 0 4px color-mix(in oklch, var(--accent) 22%, transparent)}
.pw-press{transition:transform var(--tez) var(--ease)}
.pw-press:active{transform:scale(.97)}
@media (prefers-reduced-motion:reduce){
  .pw-shimmer::after{animation:none;display:none}
  .pw-sweep::after{animation:none;display:none}
  .pw-press{transition:none}
  .pw-press:active{transform:none}
}
</style></head>
