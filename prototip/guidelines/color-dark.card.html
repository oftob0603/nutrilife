<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><link rel="stylesheet" href="../guidelines/keyframes.css"><style>body{margin:0;padding:16px;background:var(--fon);font:var(--type-body);color:var(--siyoh)}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.sw{display:flex;flex-direction:column;gap:4px;min-width:0}.chipbox{width:100%;height:56px;border-radius:var(--r-chip);border:var(--hairline)}.lbl{font:var(--type-badge);color:var(--matn-2);font-variant-numeric:tabular-nums;white-space:nowrap}.nm{font:var(--type-caption);font-weight:var(--w-medium)}</style></head><body data-theme="dark">
<div class="row" style="align-items:stretch">

<div class="sw" style="flex:1"><div class="chipbox" style="background:var(--karta)"></div><span class="nm">--karta</span><span class="lbl">#161618</span></div>

<div class="sw" style="flex:1"><div class="chipbox" style="background:var(--matn-2);border-color:var(--matn-2)"></div><span class="nm">--matn-2</span><span class="lbl">#8A8A8F</span></div>
<div class="sw" style="flex:1"><div class="chipbox" style="background:var(--aksent);border-color:var(--aksent)"></div><span class="nm">--aksent</span><span class="lbl">#C6F04C</span></div>
</div></body></html>
