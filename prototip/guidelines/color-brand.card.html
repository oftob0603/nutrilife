<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><link rel="stylesheet" href="../guidelines/keyframes.css"><style>body{margin:0;padding:16px;background:var(--fon);font:var(--type-body);color:var(--siyoh)}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.sw{display:flex;flex-direction:column;gap:4px;min-width:0}.chipbox{width:100%;height:56px;border-radius:var(--r-chip);border:var(--hairline)}.lbl{font:var(--type-badge);color:var(--matn-2);font-variant-numeric:tabular-nums;white-space:nowrap}.nm{font:var(--type-caption);font-weight:var(--w-medium)}</style></head><body>
<div class="row" style="align-items:stretch">
<div class="sw" style="flex:1"><div class="chipbox" style="background:var(--siyoh);border-color:var(--siyoh)"></div><span class="nm">--siyoh</span><span class="lbl">#0B0B0C · text, selected fills</span></div>
<div class="sw" style="flex:1"><div class="chipbox" style="background:var(--aksent);border-color:var(--aksent)"></div><span class="nm">--aksent</span><span class="lbl">#C6F04C · primary CTA, ring, AI badge</span></div>
<div class="sw" style="flex:1"><div class="chipbox" style="background:var(--aksent);border-color:var(--aksent);display:flex;align-items:center;justify-content:center;font:var(--type-card-title);color:var(--aksent-matn)">Aa</div><span class="nm">--aksent-matn</span><span class="lbl">#2E3D07 · on-accent · 8.9:1</span></div>
</div></body></html>
