<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><link rel="stylesheet" href="../guidelines/keyframes.css"><style>body{margin:0;padding:16px;background:var(--fon);font:var(--type-body);color:var(--siyoh)}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.sw{display:flex;flex-direction:column;gap:4px;min-width:0}.chipbox{width:100%;height:56px;border-radius:var(--r-chip);border:var(--hairline)}.lbl{font:var(--type-badge);color:var(--matn-2);font-variant-numeric:tabular-nums;white-space:nowrap}.nm{font:var(--type-caption);font-weight:var(--w-medium)}</style></head><body>
<div class="row" style="align-items:stretch">
<div class="sw" style="flex:1"><div class="chipbox" style="background:var(--fon)"></div><span class="nm">--fon</span><span class="lbl">#F2F2F3</span></div>
<div class="sw" style="flex:1"><div class="chipbox" style="background:var(--karta)"></div><span class="nm">--karta</span><span class="lbl">#FFFFFF</span></div>
<div class="sw" style="flex:1"><div class="chipbox" style="background:var(--matn-2);border-color:var(--matn-2)"></div><span class="nm">--matn-2</span><span class="lbl">#6B6B70</span></div>
<div class="sw" style="flex:1"><div class="chipbox" style="background:var(--matn-3);border-color:var(--matn-3)"></div><span class="nm">--matn-3</span><span class="lbl">#A1A1A6</span></div>
<div class="sw" style="flex:1"><div class="chipbox" style="background:var(--chegara);border-color:var(--chegara)"></div><span class="nm">--chegara</span><span class="lbl">#E3E3E5</span></div>
</div></body></html>
