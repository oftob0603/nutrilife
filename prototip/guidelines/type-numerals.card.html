<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><link rel="stylesheet" href="../guidelines/keyframes.css"><style>body{margin:0;padding:16px;background:var(--fon);font:var(--type-body);color:var(--siyoh)}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.sw{display:flex;flex-direction:column;gap:4px;min-width:0}.chipbox{width:100%;height:56px;border-radius:var(--r-chip);border:var(--hairline)}.lbl{font:var(--type-badge);color:var(--matn-2);font-variant-numeric:tabular-nums;white-space:nowrap}.nm{font:var(--type-caption);font-weight:var(--w-medium)}</style></head><body>
<div class="row" style="gap:32px;align-items:stretch">
<div class="sw" style="flex:1"><span style="font:var(--type-ring);font-variant-numeric:tabular-nums">1,118<br>1,240</span><span class="lbl">tabular-nums · barqaror</span></div>
<div class="sw" style="flex:1;opacity:.5"><span style="font:var(--type-ring);font-variant-numeric:proportional-nums">1,118<br>1,240</span><span class="lbl">proportional — son sakraydi</span></div>
