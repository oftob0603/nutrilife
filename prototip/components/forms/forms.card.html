<!doctype html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css"><link rel="stylesheet" href="../../guidelines/keyframes.css">
<style>body{margin:0;padding:16px;background:var(--fon)}#r{display:flex;flex-direction:column;gap:16px}.grp{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.cap{font:var(--type-badge);color:var(--matn-2);width:100%}</style></head>
<body><div id="r"></div>
<script src="https://unpkg.com/lucide@0.454.0/dist/umd/lucide.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
const { Input, SearchField, SegmentedControl, DayPicker, Checkbox, OptionRow } = window.OzishBot_d5aadd;
function Demo(){
  const [q,setQ]=React.useState('somsa');
  const [g,setG]=React.useState('250');
  const [meal,setMeal]=React.useState('Tushlik');
  const [day,setDay]=React.useState(4);
  const [ok,setOk]=React.useState(true);
  const [terms,setTerms]=React.useState(false);
  const [goal,setGoal]=React.useState('yoqotish');
  return <>
    <SearchField value={q} onChange={setQ} onClear={()=>setQ('')}/>
    <div className="grp" style={{alignItems:'flex-start'}}>
      <Input style={{flex:1}} label="Porsiya" value={g} onChange={setG} unit="g" numeric/>
      <Input style={{flex:1}} label="Kaloriya" value="0" unit="kkal" numeric error="0 dan katta bo'lishi kerak"/>
      <Input style={{flex:1}} label="Taom nomi" value="" placeholder="Osh" />
    </div>
    <SegmentedControl options={["Nonushta","Tushlik","Kechki","Gazak"]} value={meal} onChange={setMeal}/>
    <DayPicker value={day} onChange={setDay}/>
    <div className="grp" style={{alignItems:'flex-start'}}>
      <div style={{flex:1}}>
        <Checkbox checked={ok} onChange={setOk}>18 yoshdan kattaman</Checkbox>
        <Checkbox checked={terms} onChange={setTerms} error={!terms?'Davom etish uchun kerak':undefined}>Shartlarni qabul qilaman</Checkbox>
      </div>
      <div style={{flex:1,display:'flex',flexDirection:'column',gap:12}}>
        <OptionRow label="Vazn tashlash" caption="Normadan −15%" selected={goal==='yoqotish'} onClick={()=>setGoal('yoqotish')}/>
        <OptionRow label="Vaznni saqlash" caption="Tuzatish yo'q" selected={goal==='saqlash'} onClick={()=>setGoal('saqlash')}/>
        <OptionRow multi label="Vegetarian" selected={false} onClick={()=>{}}/>
      </div>
    </div>
  </>;
}
ReactDOM.createRoot(document.getElementById('r')).render(<Demo/>);
</script></body></html>
